<!DOCTYPE html>
<html lang="el">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek Rhyme System</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141932;
            --bg-tertiary: #1e2340;
            --accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #2d3454;
            --shadow: rgba(99, 102, 241, 0.15);
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 2rem;
            margin-bottom: 3rem;
            border-radius: 16px;
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: var(--accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 1rem 2rem;
            background: transparent;
            color: var(--text-secondary);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .info-box {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-box h4 {
            color: #6366f1;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .info-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        select,
        textarea,
        input {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem 1rem;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            font-family: 'JetBrains Mono', monospace;
            min-height: 200px;
            resize: vertical;
        }

        input[type="password"] {
            font-family: 'JetBrains Mono', monospace;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }

        .checkbox-group:hover {
            border-color: #6366f1;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            accent-color: #6366f1;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        .feature-selector {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }

        .feature-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .feature-item:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }

        .feature-item input {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
        }

        .feature-item label {
            margin: 0;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px var(--shadow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--shadow);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            margin: 2rem auto;
            width: 50px;
            height: 50px;
            border: 4px solid var(--bg-tertiary);
            border-top: 4px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loader.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .result-container {
            display: none;
            margin-top: 2rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            animation: slideUp 0.4s;
        }

        .result-container.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            background: var(--bg-secondary);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .result-header h3 {
            color: #6366f1;
            font-weight: 600;
        }

        .model-badge {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .result-content {
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.8;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
        }

        .result-content::-webkit-scrollbar {
            width: 8px;
        }

        .result-content::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .result-content::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 4px;
        }

        .result-container.error {
            border-color: var(--error);
        }

        .result-container.error .result-header {
            background: rgba(239, 68, 68, 0.1);
            border-bottom-color: rgba(239, 68, 68, 0.3);
        }

        .result-container.error .result-header h3 {
            color: var(--error);
        }

        .result-container.error .model-badge {
            background: var(--error);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            header {
                padding: 1.5rem;
            }

            header h1 {
                font-size: 2rem;
            }

            .content {
                padding: 1.5rem;
            }

            .tabs {
                flex-direction: column;
            }

            .feature-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🎭 Greek Rhyme System</h1>
            <p>Ανάλυση και Δημιουργία Ομοιοκαταληξιών στη Νέα Ελληνική Ποίηση</p>
        </header>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('identify')">🔍 Αναγνώριση</button>
            <button class="tab" onclick="switchTab('generate')">✍️ Δημιουργία</button>
        </div>

        <div class="content">
            <div id="identify-tab" class="tab-content active">
                <div class="info-box">
                    <h4>Αναγνώριση Ομοιοκαταληξιών</h4>
                    <p>Εντοπισμός και ταξινόμηση ομοιοκαταληξιών (M/F2/F3, RICH, IDV, MOS, IMP, COPY)</p>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Μοντέλο AI</label>
                        <select id="model-identify">
                            <optgroup label="Claude">
                                <option value="claude-sonnet-4.5">Claude Sonnet 4.5</option>
                                <option value="claude-sonnet-3.7">Claude Sonnet 3.7</option>
                            </optgroup>
                            <optgroup label="Gemini">
                                <option value="gemini-3-pro">Gemini 3 Pro</option>
                                <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            </optgroup>
                            <optgroup label="OpenAI">
                                <option value="gpt-4o">GPT-4o</option>
                                <option value="gpt-5">GPT-5</option>
                            </optgroup>
                            <optgroup label="Open Models">
                                <option value="llama-3.3-70b">Llama 3.3 70B</option>
                                <option value="llama-3.1-70b">Llama 3.1 70B</option>
                                <option value="qwen-2.5-72b">Qwen 2.5 72B</option>
                                <option value="mistral-large">Mistral Large</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Στρατηγική</label>
                        <select id="strategy">
                            <option value="zero_shot_structured">Zero-Shot Structured</option>
                            <option value="few_shot">Few-Shot</option>
                            <option value="zero_shot_cot" selected>Zero-Shot CoT</option>
                            <option value="few_shot_cot">Few-Shot CoT</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key-identify" placeholder="Εισάγετε το API key">
                </div>

                <div class="form-group">
                    <div class="checkbox-group" onclick="document.getElementById('rag-identify').click()">
                        <input type="checkbox" id="rag-identify">
                        <label>Χρήση RAG (Παραδείγματα Corpus)</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="use-verification" checked>
                            <label>Χρήση Φωνολογικής Επαλήθευσης (Verification)</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ελληνικοί Στίχοι</label>
                    <textarea id="poem-text" placeholder="Εισάγετε στίχους..."></textarea>
                </div>

                <button onclick="identifyRhymes()">Ανάλυση</button>

                <div class="loader" id="loader-identify"></div>
                <div class="result-container" id="result-identify">
                    <div class="result-header">
                        <h3>Αποτελέσματα</h3>
                        <span class="model-badge" id="model-used-identify"></span>
                    </div>
                    <div class="result-content" id="result-text-identify"></div>
                </div>
            </div>

            <div id="generate-tab" class="tab-content">
                <div class="info-box">
                    <h4>Δημιουργία Στίχων</h4>
                    <p>Δημιουργία ποίησης με συγκεκριμένα μοτίβα ομοιοκαταληξίας</p>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Μοντέλο AI</label>
                        <select id="model-generate">
                            <optgroup label="Claude">
                                <option value="claude-sonnet-4.5">Claude Sonnet 4.5</option>
                                <option value="claude-sonnet-3.7">Claude Sonnet 3.7</option>
                            </optgroup>
                            <optgroup label="Gemini">
                                <option value="gemini-3-pro">Gemini 3 Pro</option>
                                <option value="gemini-2.5-pro" selected>Gemini 2.5 Pro</option>
                                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                            </optgroup>
                            <optgroup label="OpenAI">
                                <option value="gpt-4o">GPT-4o</option>
                                <option value="gpt-5">GPT-5</option>
                            </optgroup>
                            <optgroup label="Open Models">
                                <option value="llama-3.3-70b">Llama 3.3 70B</option>
                                <option value="llama-3.1-70b">Llama 3.1 70B</option>
                                <option value="qwen-2.5-72b">Qwen 2.5 72B</option>
                                <option value="mistral-large">Mistral Large</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Τύπος</label>
                        <select id="rhyme-type">
                            <option value="M">M - Masculine</option>
                            <option value="F2" selected>F2 - Feminine-2</option>
                            <option value="F3">F3 - Feminine-3</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>API Key</label>
                    <input type="password" id="api-key-generate" placeholder="Εισάγετε το API key">
                </div>

                <div class="form-group">
                    <label>Θέμα</label>
                    <input type="text" id="theme" placeholder="π.χ. η θάλασσα, ο έρωτας...">
                </div>

                <div class="form-group">
                    <label>Ύφος Ποιητή (προαιρετικό)</label>
                    <select id="poet-style">
                        <option value="">Κανένας (Γενικό Ύφος)</option>
                        <option value="Dionysios Solomos">Διονύσιος Σολωμός</option>
                        <option value="Kostis Palamas">Κωστής Παλαμάς</option>
                        <option value="C.P. Cavafy">Κ.Π. Καβάφης</option>
                        <option value="Kostas Karyotakis">Κώστας Καρυωτάκης</option>
                        <option value="Andreas Kalvos">Ανδρέας Κάλβος</option>
                        <option value="Aristotelis Valaoritis">Αριστοτέλης Βαλαωρίτης</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Χαρακτηριστικά</label>
                    <div class="feature-selector">
                        <div class="feature-item" onclick="document.getElementById('feat-pure').click()">
                            <input type="checkbox" id="feat-pure" value="pure" checked>
                            <label>Pure</label>
                        </div>
                        <div class="feature-item" onclick="document.getElementById('feat-rich').click()">
                            <input type="checkbox" id="feat-rich" value="RICH">
                            <label>Rich</label>
                        </div>
                        <div class="feature-item" onclick="document.getElementById('feat-idv').click()">
                            <input type="checkbox" id="feat-idv" value="IDV">
                            <label>IDV</label>
                        </div>
                        <div class="feature-item" onclick="document.getElementById('feat-mos').click()">
                            <input type="checkbox" id="feat-mos" value="MOS">
                            <label>Mosaic</label>
                        </div>
                        <div class="feature-item" onclick="document.getElementById('feat-imp').click()">
                            <input type="checkbox" id="feat-imp" value="IMP">
                            <label>Imperfect</label>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Αριθμός Στίχων</label>
                        <input type="number" id="num-lines" value="4" min="2" max="20">
                    </div>
                    <div class="form-group">
                        <div class="checkbox-group" onclick="document.getElementById('rag-generate').click()">
                            <input type="checkbox" id="rag-generate">
                            <label>Χρήση RAG</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group" onclick="document.getElementById('verification-generate').click()">
                        <input type="checkbox" id="verification-generate" checked>
                        <label>Χρήση Επαλήθευσης (Verification Loop)</label>
                    </div>
                </div>

                <button onclick="generatePoem()">Δημιουργία</button>

                <div class="loader" id="loader-generate"></div>
                <div class="result-container" id="result-generate">
                    <div class="result-header">
                        <h3>Αποτέλεσμα</h3>
                        <span class="model-badge" id="model-used-generate"></span>
                    </div>
                    <div class="result-content" id="result-text-generate"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = new URLSearchParams(window.location.search).get('api') || 'http://localhost:8055';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        async function identifyRhymes() {
            const text = document.getElementById('poem-text').value.trim();
            const apiKey = document.getElementById('api-key-identify').value.trim();
            if (!text || !apiKey) {
                alert('Παρακαλώ συμπληρώστε όλα τα πεδία');
                return;
            }

            showLoader('identify');

            try {
                const useVerification = document.getElementById('use-verification').checked;
                const endpoint = useVerification ? '/identify/verified' : '/identify';
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        model: document.getElementById('model-identify').value,
                        prompt_strategy: document.getElementById('strategy').value,
                        use_rag: document.getElementById('rag-identify').checked,
                        api_key: apiKey
                    })
                });

                const data = await response.json();
                response.ok ? showResult('identify', data.result, data.generation_model)
                    : showError('identify', data.detail || 'Σφάλμα');
            } catch (error) {
                showError('identify', 'Σφάλμα σύνδεσης: ' + error.message);
            }
        }

        async function generatePoem() {
            const theme = document.getElementById('theme').value.trim();
            const apiKey = document.getElementById('api-key-generate').value.trim();
            const features = Array.from(document.querySelectorAll('.feature-item input:checked')).map(cb => cb.value);

            if (!theme || !apiKey || !features.length) {
                alert('Παρακαλώ συμπληρώστε όλα τα πεδία');
                return;
            }

            showLoader('generate');

            try {
                const response = await fetch(`${API_URL}/agent/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        theme,
                        rhyme_type: document.getElementById('rhyme-type').value,
                        features,
                        num_lines: parseInt(document.getElementById('num-lines').value),
                        model: document.getElementById('model-generate').value,
                        use_rag: document.getElementById('rag-generate').checked,
                        use_verification: document.getElementById('verification-generate').checked,
                        poet: document.getElementById('poet-style').value,
                        api_key: apiKey
                    })
                });

                const data = await response.json();
                response.ok ? showResult('generate', data.poem + '\n\nVERIFICATION:\n' + JSON.stringify(data.verification, null, 2), data.generation_model)
                    : showError('generate', data.detail || 'Σφάλμα');
            } catch (error) {
                showError('generate', 'Σφάλμα σύνδεσης: ' + error.message);
            }
        }

        function showLoader(type) {
            document.getElementById(`loader-${type}`).classList.add('show');
            document.getElementById(`result-${type}`).classList.remove('show');
        }

        function showResult(type, result, model) {
            document.getElementById(`loader-${type}`).classList.remove('show');
            const container = document.getElementById(`result-${type}`);
            container.classList.remove('error');
            container.classList.add('show');
            document.getElementById(`model-used-${type}`).textContent = model;
            document.getElementById(`result-text-${type}`).textContent = result;
        }

        function showError(type, message) {
            document.getElementById(`loader-${type}`).classList.remove('show');
            const container = document.getElementById(`result-${type}`);
            container.classList.add('show', 'error');
            document.getElementById(`model-used-${type}`).textContent = 'Error';
            document.getElementById(`result-text-${type}`).textContent = message;
        }

        window.addEventListener('load', () => {
            document.getElementById('poem-text').value = 'Πάνω στην άμμο την ξανθή\nγράψαμε τ\' όνομά της·\nωραία που φύσηξεν ο μπάτης\nκαι σβήστηκε η γραφή.';
        });
    </script>
</body>

</html>
